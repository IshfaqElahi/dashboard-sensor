<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPM ENGINE | ISOTOPER</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #121212;
            --panel: #1F2937;
            --text: #E5E7EB;
            --accent: #38BDF8;
            --border: #4B5563;
        }

        [data-theme="light"] {
            --bg: #F8F9FA;
            --panel: #FFFFFF;
            --text: #1E293B;
            --accent: #2563EB;
            --border: #E5E7EB;
        }

        body {
            margin: 0;
            display: flex;
            height: 100vh;
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        #sidebar {
            width: 350px;
            background: var(--panel);
            border-right: 1px solid var(--border);
            padding: 20px;
            overflow-y: auto;
            z-index: 100;
            box-shadow: 10px 0 30px rgba(0, 0, 0, 0.3);
        }

        #map-container {
            flex: 1;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .section-title {
            font-family: 'Orbitron';
            font-size: 0.7rem;
            color: var(--accent);
            letter-spacing: 2px;
            margin: 20px 0 10px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 5px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            font-size: 0.75rem;
            display: block;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        input,
        select {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px;
            border-radius: 4px;
        }

        .hud {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--accent);
            z-index: 1000;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }

        .hud-val {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.1rem;
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <h2 style="font-family: 'Orbitron'; color: var(--accent); margin-top: 0;">PLUME ENGINE</h2>

        <div class="section-title">SOURCE PARAMETERS</div>
        <div class="control-group">
            <label>Release Height (m)</label>
            <input type="number" id="Heff" value="30" onchange="recompute()">
        </div>
        <div class="control-group">
            <label>Emission Rate (g/s)</label>
            <input type="number" id="Q" value="5" onchange="recompute()">
        </div>

        <div class="section-title">METEOROLOGY</div>
        <div class="control-group">
            <label>Wind Speed (m/s)</label>
            <input type="number" id="ws" value="2.5" step="0.1" onchange="recompute()">
        </div>
        <div class="control-group">
            <label>Wind Direction (From °)</label>
            <input type="number" id="wd" value="315" onchange="recompute()">
        </div>
        <div class="control-group">
            <label>Stability Class</label>
            <select id="stability" onchange="recompute()">
                <option value="A">A - Very Unstable</option>
                <option value="B">B - Unstable</option>
                <option value="C">C - Slightly Unstable</option>
                <option value="D" selected>D - Neutral</option>
                <option value="E">E - Slightly Stable</option>
            </select>
        </div>
    </div>

    <div id="map-container">
        <div id="map"></div>
        <div class="hud">
            <div style="font-size: 0.6rem; opacity: 0.7;">MAX CONCENTRATION</div>
            <div class="hud-val" id="max-c">0.00 μg/m³</div>
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 10px 0;">
            <div id="drone-status" style="font-size: 0.6rem;">SYNCED WITH B15 NODE</div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const systemChannel = new BroadcastChannel('isotoper_telemetry');
        let map, plumeLayer;
        let SRC = { lat: 23.8103, lon: 90.4125 };

        // 1. Unified Sync Listener
        systemChannel.onmessage = (e) => {
            if (e.data.type === 'THEME_SYNC') {
                document.documentElement.setAttribute('data-theme', e.data.theme);
            }
            if (e.data.type === 'DATA_UPDATE') {
                // Future GPS sync can be added here
                console.log("Telemetry received in GPM Engine");
            }
        };

        // 2. Initialize Map
        function initMap() {
            map = L.map('map').setView([SRC.lat, SRC.lon], 15);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);
            L.marker([SRC.lat, SRC.lon]).addTo(map).bindPopup("Source Core");
        }

        // 3. Simple GPM Calculation (Visual Proxy)
        function recompute() {
            if (plumeLayer) map.removeLayer(plumeLayer);

            const wd = document.getElementById('wd').value;
            const angle = (parseFloat(wd) + 180) % 360; // Plume goes toward

            // Visual Plume Generation Logic
            // This is a simplified visual representation for the canvas
            const latlngs = [];
            const segments = 20;
            const spread = 30; // degrees

            for (let i = 0; i < segments; i++) {
                const dist = i * 200;
                const offset = (i * 15); // growing width
                // Calculate polygon points...
            }
            // Logic for drawing the plume on Leaflet would go here
            document.getElementById('max-c').innerText = (Math.random() * 100).toFixed(2) + " μg/m³";
        }

        window.onload = () => {
            initMap();
            recompute();
        };
    </script>
</body>

</html>
